<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les éléments d'un tableau</title>
</head>
<body>
    <table border="2" style="text-align: center; margin: auto; width: 60%; height: 300px; font-size: 24px;  ">
        <caption>Calcul de la moyenne</caption>
        <thead>
            <tr>
                <th>Matière</th>
                <th>Note par matière</th>
                <th>Coefficient</th>
                <th>Note * Coefficient</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Mathématiques</td>
                <td>17</td>
                <td>4</td>
                <td>68</td>
            </tr>
            <tr>
                <td>Physique</td>
                <td>15</td>
                <td>3</td>
                <td>45</td> 
              </tr>
            <tr>
                <td>Informatique</td>
                <td>18</td>
                <td>2</td>
                <td>32</td>
            </tr>
            <tr>
                <td r colspan="2">Total</td>
                <td>9</td>
                <td>145</td>
            </tr>

        </tbody>
        <tfoot style="color: blue">
            <tr>
                <td colspan="3">Moyenne</td>
                <td>16.11</td>
            </tr>
        </tfoot>


    </table>
    
</body>
</html>
